name: Update contribution heatmap

on:
  schedule:
    - cron: "30 21 * * *" # daily 21:30 UTC = 05:30 Beijing, after the UTC day closes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build heatmap SVGs
        run: node scripts/build-heatmap.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heatmap-light.svg heatmap-dark.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh contribution heatmap"
            git push
          fi
