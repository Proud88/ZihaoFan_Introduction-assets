name: Update contribution graph

on:
  schedule:
    - cron: "30 21 * * *" # daily 21:30 UTC = 05:30 Beijing, after the UTC day closes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build native-style contribution graph SVGs
        run: node scripts/build-contrib-graph.mjs --out dist
        env:
          # PAT so private-repo contributions are counted anonymously (as GitHub does
          # for the owner's own graph); GITHUB_TOKEN would only see public activity.
          GITHUB_TOKEN: ${{ secrets.CONTRIB_TOKEN }}

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
